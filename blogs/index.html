<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>blog — ayyp</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500;600&family=Lora:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root[data-theme="dark"] {
      --base: #272420; --mantle: #1e1c19; --surface: #38332d; --overlay: #6e6258;
      --text: #e8ddd0; --subtext: #b0a090;
      --blue: #c4a882; --mauve: #c4a882; --green: #c4a882; --peach: #b0a090; --red: #c47062;
    }
    :root[data-theme="light"] {
      --base: #f6f2ec; --mantle: #ece8e0; --surface: #d4cec4; --overlay: #8a7e70;
      --text: #2a2218; --subtext: #5a4e42;
      --blue: #7a5a3a; --mauve: #7a5a3a; --green: #7a5a3a; --peach: #5a4e42; --red: #8a3a2a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--base);
      color: var(--text);
      min-height: 100vh;
      transition: background 0.2s, color 0.2s;
    }
    a { color: inherit; text-decoration: none; }

    /* ── NAV ── */
    header { border-bottom: 1px solid var(--surface); }
    nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      max-width: 760px;
      margin: 0 auto;
      padding: 1.25rem 2rem;
      gap: 1.5rem;
    }
    .brand {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1rem;
      font-weight: 500;
      color: var(--text);
      text-decoration: none;
    }
    .brand:hover { color: var(--accent); text-decoration: none; }
    .nav-links { display: flex; align-items: center; gap: 1.75rem; }
    .nav-links a { font-size: 0.88rem; color: var(--subtext); text-decoration: none; }
    .nav-links a:hover { color: var(--text); text-decoration: none; }
    #toggle {
      background: none;
      border: 1px solid var(--surface);
      color: var(--subtext);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      padding: 0.2rem 0.55rem;
      cursor: pointer;
      border-radius: 3px;
      transition: border-color 0.15s, color 0.15s;
    }
    #toggle:hover { border-color: var(--overlay); color: var(--text); }
    :root[data-theme="dark"] { --accent: #c4a882; }
    :root[data-theme="light"] { --accent: #7a5a3a; }

    /* ── MAIN ── */
    main {
      max-width: 760px;
      margin: 0 auto;
      padding: 4rem 2rem 6rem;
    }

    h1 {
      font-family: 'Lora', Georgia, serif;
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 0.4rem;
      color: var(--text);
    }
    .subtitle {
      color: var(--subtext);
      font-size: 0.9rem;
      margin-bottom: 3rem;
    }

    /* ── POST LIST ── */
    .post-list { display: flex; flex-direction: column; gap: 0; }

    .post-item {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 1rem;
      padding: 1rem 0;
      border-bottom: 1px solid var(--surface);
      transition: color 0.15s;
    }
    .post-item:first-child { border-top: 1px solid var(--surface); }
    .post-item:hover .post-title { color: var(--blue); }

    .post-left { display: flex; flex-direction: column; gap: 0.25rem; flex: 1; }
    .post-title { font-size: 1rem; font-weight: 500; line-height: 1.4; }
    .post-desc { font-size: 0.82rem; color: var(--subtext); }
    .post-tag {
      font-size: 0.7rem;
      font-family: 'JetBrains Mono', monospace;
      color: var(--mauve);
      background: color-mix(in srgb, var(--mauve) 12%, transparent);
      padding: 0.1rem 0.4rem;
      border-radius: 3px;
      white-space: nowrap;
    }
    .post-date {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      color: var(--overlay);
      white-space: nowrap;
    }

    /* ── EMPTY STATE ── */
    .empty {
      padding: 3rem 0;
      color: var(--overlay);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
    }
    .empty::before { content: '// '; }

    @media (max-width: 500px) {
      main { padding: 2.5rem 1.25rem 4rem; }
      nav { padding: 1rem 1.25rem; }
      .post-item { flex-direction: column; gap: 0.4rem; }
      .post-date { align-self: flex-start; }
    }
  </style>
  <script data-goatcounter="https://ayyp.goatcounter.com/count"
          async src="//gc.zgo.at/count.js"></script>
</head>
<body>
  <header>
    <nav>
      <a href="/" class="brand">ayyp</a>
      <div class="nav-links">
        <a href="/blogs">writing</a>
        <a href="https://github.com/ayyp1" target="_blank" rel="noopener">github</a>
        <a href="https://www.linkedin.com/in/ashish-kumar-pokharel-03969a270/" target="_blank" rel="noopener">linkedin</a>
        <button id="toggle">light</button>
      </div>
    </nav>
  </header>

  <main>
    <h1>Blog</h1>
    <p class="subtitle">writing on AI, systems, and things i find interesting.</p>

    <div class="post-list">
      <a class="post-item" href="/blogs/training-gpt2">
        <div class="post-left">
          <span class="post-title">Training GPT-2: My Experience</span>
          <span class="post-desc">From applying AI to understanding it — kernels, flash attention, and a lot of PyTorch relearning.</span>
        </div>
        <div style="display:flex;align-items:center;gap:0.5rem">
          <span class="post-tag">ml</span>
          <span class="post-date">Aug 26, 2026</span>
        </div>
      </a>
    </div>
  </main>

  <script>
    const btn = document.getElementById('toggle');
    const root = document.documentElement;
    function makeFavicon() {
      const c = document.createElement('canvas');
      c.width = c.height = 64;
      const ctx = c.getContext('2d');
      const isDark = root.dataset.theme === 'dark';
      ctx.fillStyle = isDark ? '#1e1c19' : '#ece8e0';
      ctx.fillRect(0, 0, 64, 64);
      ctx.fillStyle = isDark ? '#c4a882' : '#7a5a3a';
      ctx.font = 'bold 56px "JetBrains Mono", monospace';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('a', 32, 34);
      let link = document.querySelector("link[rel='icon']");
      if (!link) { link = document.createElement('link'); document.head.appendChild(link); }
      link.rel = 'icon'; link.href = c.toDataURL();
    }
    function setTheme(t) {
      root.dataset.theme = t;
      btn.textContent = t === 'dark' ? 'light' : 'dark';
      localStorage.setItem('theme', t);
      makeFavicon();
    }
    const saved = localStorage.getItem('theme');
    setTheme(saved === 'light' ? 'light' : 'dark');
    btn.addEventListener('click', () => setTheme(root.dataset.theme === 'dark' ? 'light' : 'dark'));
    document.querySelectorAll('a[href^="http"]').forEach(a => { a.target = '_blank'; a.rel = 'noopener'; });
  </script>
</body>
</html>
